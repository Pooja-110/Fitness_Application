plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.biowellness.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.biowellness.app"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // AI chat (Groq) API key.
        //
        // SECURITY FIX: this used to be a live key hardcoded directly in
        // AiChatEngine.kt, shipped inside every APK. Anyone could pull it
        // out of the compiled app with a decompiler and use it to run up
        // your Groq bill or abuse the API under your account — the key
        // that was in this source tree should be treated as already
        // compromised and REVOKED/rotated in your Groq dashboard.
        //
        // Supply a real key locally via gradle.properties (untracked by
        // git — add it to .gitignore) or an environment variable, e.g.
        // in ~/.gradle/gradle.properties or this project's own
        // gradle.properties (do NOT commit it):
        //     GROQ_API_KEY=gsk_your_real_key_here
        // Falls back to an empty string, which AiChatEngine treats as
        // "not configured" and reports clearly instead of failing silently.
        def groqKey = project.findProperty("GROQ_API_KEY") ?: System.getenv("GROQ_API_KEY") ?: ""
        buildConfigField "String", "GROQ_API_KEY", "\"${groqKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2023.10.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ML Kit Text Recognition (Added Here)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Permissions & Utilities
    implementation 'com.google.accompanist:accompanist-permissions:0.33.2-alpha'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}